<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twiggo - Sort the Fruit</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="level level-1">
    <div id="mascot-slot" class="level-mascot"></div>
    <div class="fruit-tray" id="fruit-tray"></div>
    <div class="bins">
      <div class="bin" id="bin-red" data-match="red"><span class="bin__label">🔴</span></div>
      <div class="bin" id="bin-yellow" data-match="yellow"><span class="bin__label">🟡</span></div>
    </div>
    <a href="../index.html" class="back-link" aria-label="Back to map">↩️</a>
  </main>
  <script type="module" src="level-1-classification.js"></script>
</body>
</html>
