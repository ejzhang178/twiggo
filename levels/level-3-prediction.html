<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twiggo - Guess What's Next</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="level level-3">
    <div id="mascot-slot" class="level-mascot"></div>
    <div class="prediction-fruit" id="prediction-fruit"></div>
    <div class="bins prediction-bins">
      <div class="bin" id="bin-red" data-match="red"><span class="bin__label">🔴</span></div>
      <div class="bin" id="bin-yellow" data-match="yellow"><span class="bin__label">🟡</span></div>
    </div>
    <button class="next-btn" id="next-btn">▶️</button>
    <div class="end-screen" id="end-screen" hidden></div>
    <a href="../index.html" class="back-link" aria-label="Back to map">↩️</a>
  </main>
  <script type="module" src="level-3-prediction.js"></script>
</body>
</html>
